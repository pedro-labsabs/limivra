[workspace]
members = [
    "crates/limivra-core",
    "crates/limivra-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Limivra Contributors"]
license = "MIT"
repository = "https://github.com/pedro-labsabs/limivra"

[workspace.dependencies]
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
